name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      NEXT_PUBLIC_APP_MODE: api
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-build-placeholder-not-a-deployment-key
      PREVIEW_BASE_URL: https://preview.ci.invalid
      API_INTERNAL_ORIGIN: http://127.0.0.1:18010
      SUPABASE_INTERNAL_ORIGIN: http://127.0.0.1:54321
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: python3 -m unittest infra/release/test_deploy.py infra/release/test_package.py
      - run: python3 infra/release/build.py
      - run: python3 infra/release/package.py api ci-api
      - run: python3 infra/release/package.py web ci-web

  postgres:
    name: Real PostgreSQL repair and recovery (external HTTP fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          # Disposable runner-only database password; never a deployment credential.
          POSTGRES_PASSWORD: pivloom-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:contracts
      - name: Prepare six empty databases with the actual migrations
        run: node apps/api/scripts/testing/prepare-ci-database.mjs
        env:
          PIVLOOM_CI_POSTGRES_URL: postgres://postgres:pivloom-ci-only@127.0.0.1:5432/postgres
      - name: Run real PostgreSQL integration tests
        run: >-
          npm test --workspace @pivloom/api --
          tests/generation/build-repair.integration.test.ts
          tests/generation/recovery-service.integration.test.ts
        env:
          PIVLOOM_REPAIR_INTEGRATION: '1'
      - name: Run rollback against its own empty PostgreSQL database
        run: |
          export DATABASE_URL="$PIVLOOM_ROLLBACK_DATABASE_URL"
          export MIGRATION_DATABASE_URL="$PIVLOOM_ROLLBACK_DATABASE_URL"
          npm test --workspace @pivloom/api -- tests/generation/rollback.integration.test.ts
        env:
          PIVLOOM_ROLLBACK_INTEGRATION: '1'
      - name: Run the complete executor lifecycle suite on runner-local PostgreSQL
        run: |
          export DATABASE_URL="$PIVLOOM_EXECUTOR_DATABASE_URL"
          export MIGRATION_DATABASE_URL="$PIVLOOM_EXECUTOR_DATABASE_URL"
          export PIVLOOM_ENVIRONMENT_ID="$PIVLOOM_EXECUTOR_ENVIRONMENT_ID"
          npm test --workspace @pivloom/api -- tests/generation/executor.integration.test.ts
        env:
          PIVLOOM_EXECUTOR_INTEGRATION: '1'
      - name: Continue an explicit candidate through real HTTP and PostgreSQL
        run: npm test --workspace @pivloom/api -- tests/generation/candidate-http.integration.test.ts
        env:
          PIVLOOM_CANDIDATE_INTEGRATION: '1'
      - name: Preserve review evidence and enforce the deadline through PostgreSQL commit
        run: |
          export DATABASE_URL="$PIVLOOM_REVIEW_DATABASE_URL"
          export MIGRATION_DATABASE_URL="$PIVLOOM_REVIEW_DATABASE_URL"
          export PIVLOOM_ENVIRONMENT_ID="$PIVLOOM_REVIEW_ENVIRONMENT_ID"
          npm test --workspace @pivloom/api -- tests/generation/review.integration.test.ts -t 'a timed-out Reviewer can recheck|one infrastructure failure rebinds|linked retry may reuse|a late visual transport failure|a completed receipt arriving past|a database delay after'
        env:
          PIVLOOM_REVIEW_INTEGRATION: '1'
          # These selected cases use in-memory object storage, never a live Supabase service.
          SUPABASE_URL: https://fixture.invalid
          SUPABASE_SECRET_KEY: fixture-ci-only
      - name: Run the durable queue against its own PostgreSQL database
        run: |
          export DATABASE_URL="$PIVLOOM_QUEUE_DATABASE_URL"
          export MIGRATION_DATABASE_URL="$PIVLOOM_QUEUE_DATABASE_URL"
          export PIVLOOM_ENVIRONMENT_ID="$PIVLOOM_QUEUE_ENVIRONMENT_ID"
          npm test --workspace @pivloom/api -- tests/generation/queue.integration.test.ts
        env:
          PIVLOOM_QUEUE_INTEGRATION: '1'
      - name: State the verification boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          This job uses real PostgreSQL 17.6, all repository migrations, and six separate CI databases.
          The minimal `auth.users` table is an FK fixture, not a running Supabase Auth service.
          The repair and rollback suites supply persistence fixtures; recovery uses an external sandbox HTTP fixture.
          Test encryption keys are generated randomly inside each suite. No user, provider or SSH secrets are used.
          Real model generation and Codex browser E2E remain separate release gates; this workflow does not deploy.
          SUMMARY
